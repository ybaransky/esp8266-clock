<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
<title>Sound Settings</title>
</head>
<body>
<h1>Sound Settings</h1>

<p id="snone" class="muted" hidden>No sounds are installed. Upload the
filesystem image (<code>pio run -t uploadfs</code>) to add them.</p>

<h2>Try a sound</h2>
<label for="song">Song &mdash; a full melody</label>
<div class="soundRow"><select id="song"></select>
<button class="secondary" type="button" onclick="toggleSound(this,'song')">&#9654;</button></div>

<label for="alert">Alert &mdash; a short burst</label>
<div class="soundRow"><select id="alert"></select>
<button class="secondary" type="button" onclick="toggleSound(this,'alert')">&#9654;</button></div>

<hr>
<h2>Transition Alert</h2>
<p>A four-phase alert whose beats get progressively faster.</p>
<label for="boundaryChoice">Boundary</label>
<select id="boundaryChoice" onchange="chooseBoundary()">
  <option value="boundary1">Boundary 1</option>
  <option value="boundary2">Boundary 2</option>
</select>

<label for="toneHz">Tone (Hz)</label>
<input type="number" id="toneHz" min="100" max="5000" step="1">
<label for="totalDurationSeconds">Total duration (seconds)</label>
<input type="number" id="totalDurationSeconds" min="4" max="1200" step="1">
<label for="startingBeatsHz">Beats in starting phase (Hz)</label>
<input type="number" id="startingBeatsHz" min="1" max="10" step="1">
<div class="actions"><button class="secondary" type="button" onclick="toggleBoundaryAlert(this)">&#9654; Play</button></div>

<div class="actions"><button onclick="save()">Save</button></div>
<div id="st"></div>
<p class="footer"><a href="/">&#8592; Home</a> &nbsp;&nbsp; <a href="/settings">Settings</a></p>

<script>
// Sound dropdowns are name-valued, not index-valued: a sound's name is its
// identity in the catalog and in config.json, so re-uploading the filesystem
// cannot silently repoint a selection at a different sound.
function fill(id, names, selected, silentOption) {
  var el = $(id);
  el.innerHTML = '';
  if (silentOption) {
    var none = document.createElement('option');
    none.value = '';
    none.textContent = '(silent)';
    el.appendChild(none);
  }
  names.forEach(function (name) {
    var o = document.createElement('option');
    o.value = name;
    o.textContent = name;
    el.appendChild(o);
  });
  var wanted = selected || '';
  // A configured name the catalog no longer has would otherwise fall back to
  // the first entry without saying so. Keep it selectable and flag it instead.
  if (wanted && names.indexOf(wanted) < 0) {
    var missing = document.createElement('option');
    missing.value = wanted;
    missing.textContent = wanted + ' (not installed)';
    el.appendChild(missing);
  }
  // Fall back to the first entry so an audition dropdown is never blank.
  var first = el.options.length ? el.options[0].value : '';
  el.value = wanted ? wanted : first;
}

var boundaryPatterns = {
  boundary1: { toneHz: 880, totalDurationSeconds: 40, startingBeatsHz: 2 },
  boundary2: { toneHz: 1320, totalDurationSeconds: 40, startingBeatsHz: 2 }
};
var activeBoundary = 'boundary1';

function captureBoundary() {
  boundaryPatterns[activeBoundary] = {
    toneHz: +$('toneHz').value,
    totalDurationSeconds: +$('totalDurationSeconds').value,
    startingBeatsHz: +$('startingBeatsHz').value
  };
}

function showBoundary() {
  var pattern = boundaryPatterns[activeBoundary];
  $('toneHz').value = pattern.toneHz;
  $('totalDurationSeconds').value = pattern.totalDurationSeconds;
  $('startingBeatsHz').value = pattern.startingBeatsHz;
}

function chooseBoundary() {
  captureBoundary();
  activeBoundary = $('boundaryChoice').value;
  showBoundary();
}

function toggleBoundaryAlert(button) {
  if (button === _soundButton) { stopSound(); return; }
  var frequencyHz = +$('toneHz').value;
  var totalDurationSeconds = +$('totalDurationSeconds').value;
  var startingBeatsHz = +$('startingBeatsHz').value;
  apiPost('/api/sound/test', {
    boundaryAlert: {
      frequencyHz: frequencyHz,
      totalDurationSeconds: totalDurationSeconds,
      startingBeatsHz: startingBeatsHz
    }
  }).then(function (d) {
    _soundPlaying(button, +(d && d.durationMs) || 0);
    setStatus('Playing boundary alert at ' + frequencyHz + ' Hz', 3000);
  }).catch(function () {
    _soundIdle();
    setStatus('Could not play boundary alert', 3000);
  });
}

// Requested one at a time, not in parallel: the device serves a single
// connection at a time, so concurrent fetches only queue up behind each other
// and make a slow AP link look broken.
api('/api/sounds').catch(function (e) {
  throw new Error('/api/sounds: ' + e.message);
}).then(function (s) {
  var songs = (s && s.songs) || [];
  var alerts = (s && s.alerts) || [];
  $('snone').hidden = !!(s && s.available);
  return api('/api/config').catch(function (e) {
    throw new Error('/api/config: ' + e.message);
  }).then(function (d) {
    var sound = d.sound || {};
    fill('song', songs, sound.startup, false);
    fill('alert', alerts, '', false);
    var boundary = sound.boundaryAlert || {};
    boundaryPatterns.boundary1 = boundary.boundary1 || boundaryPatterns.boundary1;
    boundaryPatterns.boundary2 = boundary.boundary2 || boundaryPatterns.boundary2;
    showBoundary();
  });
}).catch(function (e) { setStatus('API failed: ' + e.message); });

// Only the sound section is sent. /api/config patches what it is given, so
// every display and mode setting is left exactly as it was.
function save() {
  captureBoundary();
  jsonFetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      sound: {
        boundaryAlert: {
          enabled: true,
          boundary1: boundaryPatterns.boundary1,
          boundary2: boundaryPatterns.boundary2
        }
      }
    })
  }).then(function (d) {
    setStatus(d.error || d.message || 'Saved');
  }).catch(function (e) {
    setStatus('Save failed: ' + e.message);
  });
}
</script>
</body>
</html>
