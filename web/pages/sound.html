<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
<title>Beep Settings</title>
</head>
<body>
<h1>Beep Settings</h1>
<label><input type="checkbox" id="enabled"> Enable automatic beeps</label>
<label>Volume (%)<input type="number" id="volume" min="0" max="100" step="1"></label>
<h2>Short event beeps</h2>
<p>Optional 150 ms beeps at the event itself.</p>
<label><input type="checkbox" id="startupBeep"> Startup</label>
<label><input type="checkbox" id="finalBeep"> Countdown completion</label>
<label><input type="checkbox" id="fridaySunsetBeep"> Friday sunset</label>
<label><input type="checkbox" id="tradingOpenBeep"> Trading open</label>
<label><input type="checkbox" id="tradingCloseBeep"> Trading close</label>
<h2>Approach alerts</h2>
<label><input type="checkbox" id="approachEnabled"> Enable accelerating alerts</label>
<p>Four equal phases double the beep rate each time. The last beep ends at the boundary.</p>
<label>Boundary<select id="boundaryChoice" onchange="chooseBoundary()">
  <option value="boundary1">First Trading open / Friday sunset</option>
  <option value="boundary2">Last Trading close / Saturday sunset</option>
</select></label>
<label>Tone (Hz)<input type="number" id="toneHz" min="100" max="5000" step="1"></label>
<label>Total duration (seconds)<input type="number" id="totalDurationSeconds" min="4" max="1200" step="1"></label>
<label>Starting beeps per second<input type="number" id="startingBeatsHz" min="1" max="10" step="1"></label>
<p class="muted">Preview uses the saved volume and plays even when automatic beeps are disabled.</p>
<button id="preview" class="secondary" onclick="togglePreview()" disabled>Play preview</button>
<div class="actions"><button id="save" onclick="save()" disabled>Save</button></div>
<div id="st"></div>
<p class="footer"><a href="/">&#8592; Home</a> &nbsp;&nbsp; <a href="/settings">Settings</a></p>
<script>
var eventFields = ['startupBeep', 'finalBeep', 'fridaySunsetBeep', 'tradingOpenBeep', 'tradingCloseBeep'];
var boundaryPatterns = {};
var activeBoundary = 'boundary1';
var previewTimer = null;
function captureBoundary() {
  var ids = ['toneHz', 'totalDurationSeconds', 'startingBeatsHz'];
  if (ids.some(function (id) { return !$(id).value || !$(id).reportValidity(); })) return false;
  boundaryPatterns[activeBoundary] = {
    toneHz: +$('toneHz').value,
    totalDurationSeconds: +$('totalDurationSeconds').value,
    startingBeatsHz: +$('startingBeatsHz').value
  };
  return true;
}
function showBoundary() {
  var pattern = boundaryPatterns[activeBoundary];
  ['toneHz', 'totalDurationSeconds', 'startingBeatsHz'].forEach(function (id) { $(id).value = pattern[id]; });
}
function chooseBoundary() {
  if (!captureBoundary()) { $('boundaryChoice').value = activeBoundary; return; }
  activeBoundary = $('boundaryChoice').value;
  showBoundary();
}
function previewIdle() {
  clearTimeout(previewTimer);
  previewTimer = null;
  $('preview').textContent = 'Play preview';
}
function togglePreview() {
  if ($('preview').disabled) return;
  var stopping = previewTimer !== null;
  if (!stopping && !captureBoundary()) return;
  var pattern = boundaryPatterns[activeBoundary];
  var body = stopping ? { stop: true } : { boundaryAlert: {
    frequencyHz: pattern.toneHz,
    totalDurationSeconds: pattern.totalDurationSeconds,
    startingBeatsHz: pattern.startingBeatsHz
  }};
  $('preview').disabled = true;
  apiPost('/api/sound/test', body).then(function (d) {
    previewIdle();
    if (!stopping) {
      $('preview').textContent = 'Stop preview';
      previewTimer = setTimeout(previewIdle, d.durationMs + 300);
    }
    setStatus(d.message, 3000);
  }).catch(function (e) { setStatus('Preview failed: ' + e.message); })
    .then(function () { $('preview').disabled = false; });
}
api('/api/config').then(function (d) {
  var sound = d.sound;
  $('enabled').checked = sound.enabled;
  $('volume').value = sound.volume;
  eventFields.forEach(function (id) { $(id).checked = !!sound[id]; });
  $('approachEnabled').checked = sound.boundaryAlert.enabled;
  boundaryPatterns = sound.boundaryAlert;
  showBoundary();
  $('save').disabled = false;
  $('preview').disabled = false;
}).catch(function (e) { setStatus('Settings failed to load: ' + e.message); });
function save() {
  if ($('save').disabled || !captureBoundary() || !$('volume').value || !$('volume').reportValidity()) return;
  var sound = {
    enabled: $('enabled').checked, volume: +$('volume').value,
    boundaryAlert: { enabled: $('approachEnabled').checked,
      boundary1: boundaryPatterns.boundary1, boundary2: boundaryPatterns.boundary2 }
  };
  eventFields.forEach(function (id) { sound[id] = $(id).checked; });
  $('save').disabled = true;
  jsonFetch('/api/config', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sound: sound })
  }).then(function (d) { setStatus(d.error || d.message || 'Saved'); })
    .catch(function (e) { setStatus('Save failed: ' + e.message); })
    .then(function () { $('save').disabled = false; });
}
</script>
</body>
</html>
