; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
extra_scripts =
    pre:tools/cxx_flags.py
    pre:tools/check_formats.py
    pre:tools/build_web.py
    pre:tools/build_zipcodes.py
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif8266/libraries/SPI
    -Wall
    -Wextra
upload_speed = 921600
monitor_speed = 74880
monitor_filters = esp8266_exception_decoder

board_build.filesystem = littlefs

lib_deps =
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.0.0
    mathertel/OneButton@^2.6.1
    https://github.com/jpb10/SolarCalculator.git
    https://github.com/avishorp/TM1637.git

; Host-side unit tests for the modules that are pure by design: no I2C, no
; filesystem, no Arduino core. Run with `pio test -e native`.
;
; Only the pure sources are compiled in (build_src_filter); everything else in
; src/ needs real hardware and is deliberately out of scope here. test/stubs
; supplies the two headers those sources include from the Arduino world.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<schedule.cpp>
    +<display_format.cpp>
    +<datetime_validation.cpp>
    +<beep_pattern.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; A hard gate, deliberately only on this environment. The host build is the
    ; one whose warnings are easy to miss - its compile output scrolls past
    ; above the test results, and an incremental run recompiles nothing and so
    ; reports nothing. It is also the build most likely to catch a real
    ; portability defect: `long` is 64 bits here and 32 on the ESP8266, which is
    ; how the trading-boundary arithmetic bug surfaced.
    ;
    ; The cost: a future Ubuntu/GCC upgrade that adds a new warning will fail
    ; the test run for a reason unrelated to this code. If that happens, read
    ; the warning, then either fix it or drop this line - do not reach for
    ; -Wno-<whatever> without understanding what it is hiding.
    -Werror
    -I src
    -I test/stubs
